<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fm-track – live vehicle tracking demo</title>

    <!-- Leaflet: lightweight open-source map library (uses OpenStreetMap tiles) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1>fm-track demo</h1>
        <div id="status" class="status status--connecting">connecting…</div>
      </header>
      <ul id="vehicle-list"></ul>
      <footer>
        Object API + Coordinates Streaming API (SSE) on OpenStreetMap.
      </footer>
    </aside>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
