<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INTEGRATION DEMO</title>

    <!-- Leaflet: lightweight open-source map library (uses OpenStreetMap tiles) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1>INTEGRATION DEMO</h1>
        <div id="status" class="status status--connecting">connecting…</div>
        <p id="status-detail" hidden></p>
        <form id="conn-form" autocomplete="off">
          <label for="provider">API</label>
          <select id="provider"></select>
          <div id="provider-fields"></div>
          <button type="submit">Connect</button>
        </form>
      </header>
      <ul id="vehicle-list"></ul>
      <footer>
        <span id="provider-description"></span>
        Rendered on OpenStreetMap.
      </footer>
    </aside>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
